<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareMate AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
      }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body className="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Import สิ่งที่จำเป็น
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        
        // Import ไอคอนทั้งหมดที่ใช้ในแอปจากโค้ดเดิมของคุณ
        import { 
          Home, PhoneCall, Users, Map, 
          Activity, Heart, ShieldCheck, 
          Calendar, Star, ChevronRight,
          Mic, Play, CheckCircle2, Check, AlertTriangle, Sparkles,
          Search, TrendingUp, Clock, AlertOctagon, User, Settings, Bell, ChevronLeft, ToggleRight,
          Bot, Utensils, Stethoscope, ExternalLink, Plus, Pill,
          HeartPulse, Soup, Fish, ShoppingBag, Info
        } from 'lucide-react';


        
const App = () => {
  const [activeTab, setActiveTab] = useState('dashboard');

  return (
    <div className="min-h-screen bg-gray-100 flex items-center justify-center font-sans text-gray-900">
      {/* Mobile Frame Container */}
      <div className="w-full max-w-md bg-slate-50 h-[100dvh] shadow-2xl relative flex flex-col overflow-hidden">
        
        {/* Header / Top Bar - Compact (pt-4 pb-2) */}
        {(activeTab === 'dashboard' || activeTab === 'dashboard_unwell') && (
          <div className="bg-white px-6 pt-4 pb-2 shadow-sm z-10 flex justify-between items-center rounded-b-3xl shrink-0 border-b border-gray-100">
            <div className="flex items-center gap-2">
              <h1 className="font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-green-500 to-blue-600 tracking-tight">
                CareMate AI
              </h1>
            </div>
            <div className="flex gap-3">
              <button onClick={() => setActiveTab('manage_elders')} className="w-9 h-9 bg-white border border-gray-100 shadow-sm rounded-full flex items-center justify-center hover:bg-gray-50 transition active:scale-95">
                <Plus size={18} className="text-gray-600" />
              </button>
              <div className="relative">
                <button onClick={() => setActiveTab('notifications')} className="w-9 h-9 bg-white border border-gray-100 shadow-sm rounded-full flex items-center justify-center hover:bg-gray-200 transition active:scale-95">
                  <Bell size={18} className="text-gray-600" />
                </button>
                <div className="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></div>
              </div>
            </div>
          </div>
        )}

        {/* Main Content Area - Scrollable */}
        <div className={`flex-1 overflow-y-auto ${(activeTab === 'elderly_home' || activeTab === 'elderly_med_detail' || activeTab === 'elderly_home_unwell' || activeTab === 'manage_elders') ? 'pb-0' : 'pb-24'} [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none] ${(activeTab !== 'dashboard' && activeTab !== 'dashboard_unwell') ? 'pt-4' : ''}`}>
          {activeTab === 'dashboard' && <DashboardView onDetailClick={() => setActiveTab('insight_detail')} onBookClick={() => setActiveTab('carenav')} onNutritionClick={() => setActiveTab('nutrition')} onMedicationClick={() => setActiveTab('medication')} />}
          {activeTab === 'dashboard_unwell' && <DashboardUnwellView onDetailClick={() => setActiveTab('insight_detail')} onBookClick={() => setActiveTab('carenav')} onNutritionClick={() => setActiveTab('nutrition')} onMedicationClick={() => setActiveTab('medication')} />}
          {activeTab === 'insight_detail' && <InsightDetailView onBack={() => setActiveTab('dashboard')} />}
          {activeTab === 'carenav' && <CareNavView onBack={() => setActiveTab('dashboard')} />}
          {activeTab === 'call' && <CallCheckInView />}
          {activeTab === 'community' && <CommunityView />}
          {activeTab === 'assistant' && <AssistantView onNutritionClick={() => setActiveTab('nutrition')} />}
          {activeTab === 'profile' && <ProfileView onSettingsClick={() => setActiveTab('role_switch')} onLogoutClick={() => setActiveTab('dashboard_unwell')} />}
          {activeTab === 'role_switch' && <RoleSwitchView onBack={() => setActiveTab('profile')} onSave={(role) => setActiveTab(role === 'caregiver' ? 'profile' : 'elderly_home')} />}
          {activeTab === 'elderly_home' && <ElderlyHomeView onSettingsClick={() => setActiveTab('role_switch')} onMedDetailClick={() => setActiveTab('elderly_med_detail')} />}
          {activeTab === 'elderly_home_unwell' && <ElderlyHomeUnwellView onSettingsClick={() => setActiveTab('role_switch')} />}
          {activeTab === 'elderly_med_detail' && <ElderlyMedDetailView onBack={() => setActiveTab('elderly_home')} />}
          {activeTab === 'nutrition' && <NutritionView onBack={() => setActiveTab('dashboard')} />}
          {activeTab === 'medication' && <MedicationSettingsView onBack={() => setActiveTab('dashboard')} />}
          {activeTab === 'notifications' && <NotificationsView />}
          {activeTab === 'manage_elders' && <ManageEldersView onBack={() => setActiveTab('dashboard')} />}
        </div>

        {/* Bottom Navigation */}
        {(activeTab !== 'elderly_home' && activeTab !== 'elderly_med_detail' && activeTab !== 'elderly_home_unwell' && activeTab !== 'manage_elders') && (
          <div className="absolute bottom-0 w-full bg-white border-t border-gray-100 px-4 py-4 pb-8 sm:pb-6 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-20">
            <div className="flex justify-between items-center">
              <NavItem 
                icon={<Home size={24} />} 
                label="Home" 
                isActive={activeTab === 'dashboard' || activeTab === 'dashboard_unwell'} 
                onClick={() => setActiveTab('dashboard')} 
              />
              <NavItem 
                icon={<PhoneCall size={24} />} 
                label="AI Call" 
                isActive={activeTab === 'call'} 
                onClick={() => setActiveTab('call')} 
              />
              <NavItem 
                icon={<Users size={24} />} 
                label="Community" 
                isActive={activeTab === 'community'} 
                onClick={() => setActiveTab('community')} 
              />
              <NavItem 
                icon={<Bot size={24} />} 
                label="Assistant" 
                isActive={activeTab === 'assistant'} 
                onClick={() => setActiveTab('assistant')} 
              />
              <NavItem 
                icon={<User size={24} />} 
                label="Profile" 
                isActive={activeTab === 'profile'} 
                onClick={() => setActiveTab('profile')} 
              />
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// --- View Components ---

const DashboardView = ({ onDetailClick, onBookClick, onNutritionClick, onMedicationClick }) => (
  <div className="px-5 pt-2 pb-5 space-y-5 animate-fade-in">
    
    {/* Hero Section: AI Insight Analysis */}
    <div className="bg-gradient-to-bl from-blue-400 via-blue-50 to-[#f8fafc] rounded-3xl p-5 shadow-md relative overflow-hidden border border-blue-50">
      <div className="absolute -top-4 -right-4 p-4 opacity-[0.03] pointer-events-none transform rotate-12 text-blue-900">
        <Heart size={140} />
      </div>

      <div className="relative z-10">
        <div className="flex justify-between items-start">
          <div>
            <h2 className="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">สถานะคุณแม่วันนี้</h2>
            <div className="flex items-center gap-2 mt-1 mb-4">
              <span className="text-3xl font-bold tracking-tight text-gray-800">อารมณ์ดี</span>
              <span className="text-2xl animate-bounce">😊</span>
            </div>
          </div>
          
          <button onClick={onDetailClick} className="bg-white/80 backdrop-blur-sm text-blue-600 text-[10px] font-bold py-1.5 px-3 rounded-full transition flex items-center gap-1 shadow-sm border border-white/50 hover:bg-white">
            รายละเอียด <ChevronRight size={12} />
          </button>
        </div>
        
        <div className="flex items-center gap-3">
          <div className="w-20 h-20 shrink-0 flex items-center justify-center relative">
            <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90 drop-shadow-sm">
              <circle cx="50" cy="50" r="42" fill="none" stroke="#ffe4ec" strokeWidth="8" />
              <circle cx="50" cy="50" r="42" fill="none" stroke="#ff5487" strokeWidth="8" strokeDasharray="263.8" strokeDashoffset="65.9" strokeLinecap="round" />
              <circle cx="50" cy="50" r="30" fill="none" stroke="#d1fae5" strokeWidth="8" />
              <circle cx="50" cy="50" r="30" fill="none" stroke="#05d6a0" strokeWidth="8" strokeDasharray="188.4" strokeDashoffset="37.6" strokeLinecap="round" />
              <circle cx="50" cy="50" r="18" fill="none" stroke="#ede9fe" strokeWidth="8" />
              <circle cx="50" cy="50" r="18" fill="none" stroke="#8b5cf6" strokeWidth="8" strokeDasharray="113.1" strokeDashoffset="45.2" strokeLinecap="round" />
            </svg>
          </div>
          
          <div className="flex-1 bg-white/60 backdrop-blur-md rounded-2xl p-3 border border-white/40 shadow-sm min-h-[72px] flex flex-col justify-center">
            <p className="text-[11px] text-gray-700 leading-relaxed font-medium">
              "วันนี้อารมณ์ดีขึ้น <span className="text-blue-600 font-bold">15%</span> มีการพูดถึงหลานบ่อยครั้ง แนะนำให้โทรหาหรือวิดีโอคอลเย็นนี้"
            </p>
          </div>
        </div>
      </div>
    </div>

    {/* Section: การทานยา */}
    <div>
      <div className="flex justify-between items-end mb-1 px-1">
        <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest">การทานยา</h3>
        <button onClick={onMedicationClick} className="text-[10px] font-bold text-blue-500 flex items-center hover:underline">
          เพิ่มเติม <ChevronRight size={10} className="ml-0.5" />
        </button>
      </div>
      <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex h-[68px]">
        <div className="flex-1 w-1/2 bg-green-100 px-3 py-2 flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-green-600 shadow-sm shrink-0">
            <Check size={18} strokeWidth={3} />
          </div>
          <div className="flex flex-col min-w-0">
            <p className="text-[10px] text-gray-500 font-bold tracking-tight whitespace-nowrap truncate">ครั้งก่อน : มื้อเช้า</p>
            <h4 className="text-lg font-extrabold text-green-600 leading-none mt-1 truncate">เรียบร้อย</h4>
          </div>
        </div>

        <div className="w-[1px] bg-gray-50 self-stretch shrink-0"></div>

        <div className="flex-1 w-1/2 px-3 py-2 flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 shadow-sm shrink-0 border border-white">
            <Clock size={18} />
          </div>
          <div className="flex flex-col min-w-0">
            <p className="text-[10px] text-gray-500 font-bold tracking-tight whitespace-nowrap truncate">ถัดไป : มื้อเที่ยง</p>
            <h4 className="text-lg text-gray-800 leading-none font-extrabold mt-1 truncate">
              12:30 <span className="text-[10px] font-bold ml-0.5 text-gray-400">น.</span>
            </h4>
          </div>
        </div>
      </div>
    </div>

    {/* Section: เมนูแนะนำ */}
    <div>
      <div className="flex justify-between items-end mb-1 px-1">
        <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest">เมนูแนะนำ</h3>
        <button onClick={onNutritionClick} className="text-[10px] font-bold text-blue-500 flex items-center hover:underline">
          เพิ่มเติม <ChevronRight size={10} className="ml-0.5" />
        </button>
      </div>
      <div className="bg-white rounded-3xl h-[88px] border border-gray-100 relative overflow-hidden shadow-sm group cursor-pointer">
        <img 
          src="https://res.cloudinary.com/dsbnkeqki/image/upload/q_auto/f_auto/v1779068039/Gemini_Generated_Image_e2msfee2msfee23ms_x60wcg.png" 
          alt="เมนูแนะนำ" 
          className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" 
          onError={(e) => {
            e.target.onerror = null; 
            e.target.src = 'https://via.placeholder.com/800x175?text=Recommended+Menu'; 
          }}
        />
        <div className="absolute bottom-2 left-0 right-0 flex justify-center gap-1">
          <div className="w-1.5 h-1.5 rounded-full bg-white shadow-sm"></div>
          <div className="w-1.5 h-1.5 rounded-full bg-white/40"></div>
          <div className="w-1.5 h-1.5 rounded-full bg-white/40"></div>
        </div>
      </div>
    </div>

    {/* Upcoming Section */}
    <div>
      <div className="flex justify-between items-end mb-1 px-1">
        <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest">นัดหมายที่กำลังมาถึง</h3>
        <button className="text-[10px] font-bold text-blue-500 flex items-center hover:underline">
          เพิ่มเติม <ChevronRight size={10} className="ml-0.5" />
        </button>
      </div>
      <div className="bg-white p-3.5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-3 hover:border-blue-100 transition-colors cursor-pointer">
        <div className="w-12 h-12 rounded-2xl bg-blue-50 flex flex-col items-center justify-center text-blue-600 shrink-0 border border-blue-100/50">
          <span className="text-base font-bold leading-none">29</span>
          <span className="text-[9px] font-bold mt-1 text-blue-400 uppercase">พ.ค.</span>
        </div>
        <div className="flex-1">
          <h4 className="font-bold text-gray-800 text-sm">ตรวจสุขภาพประจำปี</h4>
          <p className="text-[10px] text-gray-400 font-medium mt-0.5 flex items-center gap-1">
            <Map size={10} /> โรงพยาบาลรามาธิบดี
          </p>
        </div>
        
        <button 
          onClick={(e) => { e.stopPropagation(); onBookClick && onBookClick(); }}
          className="bg-[#015DAD] text-white border border-blue-200 px-3 py-2 rounded-xl flex items-center justify-center gap-1.5 hover:bg-[#014F95] transition shadow-sm shrink-0"
        >
          <span className="text-[11px] font-bold leading-none whitespace-nowrap">
             จองผู้ช่วย
          </span>
          <ChevronRight size={14} strokeWidth={3} className="text-white/90 shrink-0" />
        </button>
      </div>
    </div>
  </div>
);

// --- New Dashboard Unwell View (Caregiver perspective) ---
const DashboardUnwellView = ({ onDetailClick, onBookClick, onNutritionClick, onMedicationClick }) => (
  <div className="px-5 pt-2 pb-5 space-y-5 animate-fade-in">
    
    {/* Hero Section: AI Insight Analysis (Warning Theme) */}
    <div className="bg-gradient-to-bl from-red-400 via-red-50 to-[#fff5f5] rounded-3xl p-5 shadow-md relative overflow-hidden border border-red-100">
      <div className="absolute -top-4 -right-4 p-4 opacity-[0.03] pointer-events-none transform rotate-12 text-red-900">
        <Activity size={140} />
      </div>

      <div className="relative z-10">
        <div className="flex justify-between items-start">
          <div>
            <h2 className="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">สถานะคุณแม่วันนี้</h2>
            <div className="flex items-center gap-2 mt-1 mb-4">
              <span className="text-3xl font-bold tracking-tight text-red-600">รู้สึกไม่สบาย</span>
              <span className="text-2xl animate-pulse">🤒</span>
            </div>
          </div>
          
          <button onClick={onDetailClick} className="bg-white/80 backdrop-blur-sm text-red-600 text-[10px] font-bold py-1.5 px-3 rounded-full transition flex items-center gap-1 shadow-sm border border-red-200 hover:bg-white">
            รายละเอียด <ChevronRight size={12} />
          </button>
        </div>
        
        <div className="flex items-center gap-3">
          <div className="w-20 h-20 shrink-0 flex items-center justify-center relative">
            <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90 drop-shadow-sm">
              <circle cx="50" cy="50" r="42" fill="none" stroke="#ffe4ec" strokeWidth="8" />
              <circle cx="50" cy="50" r="42" fill="none" stroke="#ff5487" strokeWidth="8" strokeDasharray="263.8" strokeDashoffset="158.2" strokeLinecap="round" />
              <circle cx="50" cy="50" r="30" fill="none" stroke="#d1fae5" strokeWidth="8" />
              <circle cx="50" cy="50" r="30" fill="none" stroke="#05d6a0" strokeWidth="8" strokeDasharray="188.4" strokeDashoffset="131.8" strokeLinecap="round" />
              <circle cx="50" cy="50" r="18" fill="none" stroke="#ede9fe" strokeWidth="8" />
              <circle cx="50" cy="50" r="18" fill="none" stroke="#8b5cf6" strokeWidth="8" strokeDasharray="113.1" strokeDashoffset="90.4" strokeLinecap="round" />
            </svg>
          </div>
          
          <div className="flex-1 bg-white/60 backdrop-blur-md rounded-2xl p-3 border border-red-100 shadow-sm min-h-[72px] flex flex-col justify-center">
            <p className="text-[11px] text-gray-700 leading-relaxed font-medium">
              "เสียงอ่อนเพลียและบ่นปวดหัว <span className="text-red-600 font-bold">สุขภาพกายลดลง 30%</span> แนะนำให้ดูแลอย่างใกล้ชิดและปรึกษาแพทย์"
            </p>
          </div>
        </div>
      </div>
    </div>

    {/* MorDee Recommendation Banner */}
    <button className="relative w-full h-24 bg-gradient-to-r from-orange-50 to-red-50 rounded-2xl shadow-sm border border-red-100 overflow-hidden flex items-center text-left hover:shadow-md active:scale-[0.99] transition">
      
      {/* Image */}
      <img
        src="https://res.cloudinary.com/dsbnkeqki/image/upload/q_auto/f_auto/v1779164161/Picture7_oh1jqg.png"
        alt="ปรึกษาแพทย์ด่วน"
        className="absolute left-0 top-0 w-28 h-full object-cover"
      />

      {/* Content */}
      <div className="pl-32 pr-10 flex-1 min-w-0 relative z-10">
        <div className="flex items-center gap-2 min-w-0">
          <h4 className="font-bold text-red-900 truncate">
            ปรึกษาแพทย์ แอพหมอดี
          </h4>

          <span className="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">
            แนะนำ
          </span>
        </div>

        <p className="text-xs text-red-600 mt-1 truncate">
          จากอาการไม่สบาย<br />แนะนำพบแพทย์เพื่อประเมินอาการ
        </p>

      </div>

      <ChevronRight size={20} className="absolute right-4 text-red-300 shrink-0" />
    </button>

    {/* Section: การทานยา */}
    <div>
      <div className="flex justify-between items-end mb-1 px-1">
        <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest">การทานยา</h3>
        <button onClick={onMedicationClick} className="text-[10px] font-bold text-blue-500 flex items-center hover:underline">
          เพิ่มเติม <ChevronRight size={10} className="ml-0.5" />
        </button>
      </div>
      <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex h-[68px]">
        <div className="flex-1 w-1/2 bg-green-100 px-3 py-2 flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-green-600 shadow-sm shrink-0">
            <Check size={18} strokeWidth={3} />
          </div>
          <div className="flex flex-col min-w-0">
            <p className="text-[10px] text-gray-500 font-bold tracking-tight whitespace-nowrap truncate">ครั้งก่อน : มื้อเช้า</p>
            <h4 className="text-lg font-extrabold text-green-600 leading-none mt-1 truncate">เรียบร้อย</h4>
          </div>
        </div>

        <div className="w-[1px] bg-gray-50 self-stretch shrink-0"></div>

        <div className="flex-1 w-1/2 px-3 py-2 flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 shadow-sm shrink-0 border border-white">
            <Clock size={18} />
          </div>
          <div className="flex flex-col min-w-0">
            <p className="text-[10px] text-gray-500 font-bold tracking-tight whitespace-nowrap truncate">ถัดไป : มื้อเที่ยง</p>
            <h4 className="text-lg text-gray-800 leading-none font-extrabold mt-1 truncate">
              12:30 <span className="text-[10px] font-bold ml-0.5 text-gray-400">น.</span>
            </h4>
          </div>
        </div>
      </div>
    </div>

    {/* Section: เมนูแนะนำ */}
    <div>
      <div className="flex justify-between items-end mb-1 px-1">
        <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest">เมนูแนะนำ</h3>
        <button onClick={onNutritionClick} className="text-[10px] font-bold text-blue-500 flex items-center hover:underline">
          เพิ่มเติม <ChevronRight size={10} className="ml-0.5" />
        </button>
      </div>
      <div className="bg-white rounded-3xl h-[88px] border border-gray-100 relative overflow-hidden shadow-sm group cursor-pointer">
        <img 
          src="https://res.cloudinary.com/dsbnkeqki/image/upload/q_auto/f_auto/v1779068039/Gemini_Generated_Image_e2msfee2msfee23ms_x60wcg.png" 
          alt="เมนูแนะนำ" 
          className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" 
          onError={(e) => {
            e.target.onerror = null; 
            e.target.src = 'https://via.placeholder.com/800x175?text=Recommended+Menu'; 
          }}
        />
        <div className="absolute bottom-2 left-0 right-0 flex justify-center gap-1">
          <div className="w-1.5 h-1.5 rounded-full bg-white shadow-sm"></div>
          <div className="w-1.5 h-1.5 rounded-full bg-white/40"></div>
          <div className="w-1.5 h-1.5 rounded-full bg-white/40"></div>
        </div>
      </div>
    </div>

    {/* Upcoming Section */}

const ElderlyHomeView = ({ onSettingsClick, onMedDetailClick }) => {
  const [showPinPad, setShowPinPad] = useState(false);
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);

  const handlePinPress = (num) => {
    if (pin.length < 4) {
      const newPin = pin + num;
      setPin(newPin);
      setError(false);
      
      if (newPin.length === 4) {
        // กำหนดรหัส PIN จำลองคือ 1234
        if (newPin === '1234') {
          setTimeout(() => {
            setShowPinPad(false);
            setPin('');
            onSettingsClick();
          }, 200);
        } else {
          setError(true);
          setTimeout(() => setPin(''), 500); // ล้างรหัสถ้าใส่ผิด
        }
      }
    }
  };

  const handleBackspace = () => {
    setPin(pin.slice(0, -1));
    setError(false);
  };

  // แสดงหน้าจอใส่ PIN
  if (showPinPad) {
    return (
      <div className="px-5 py-8 space-y-6 animate-fade-in flex flex-col items-center justify-center min-h-[80vh]">
        <div className="w-full relative">
          <button onClick={() => { setShowPinPad(false); setPin(''); setError(false); }} className="absolute left-0 top-0 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 hover:bg-gray-50 transition active:scale-95">
            <ChevronLeft size={20} className="text-gray-600" />
          </button>
        </div>
        
        <div className="text-center mt-8 mb-4">
          <div className="w-16 h-16 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
            <ShieldCheck size={32} />
          </div>
          <h2 className="text-2xl font-extrabold text-gray-800">ยืนยันตัวตน</h2>
          <p className="text-gray-500 text-sm mt-2">กรุณาใส่รหัสผ่านผู้ดูแล เพื่อเข้าสู่การตั้งค่า<br/>(PIN: 1234)</p>
        </div>

        <div className="flex gap-4 justify-center mb-10">
          {[...Array(4)].map((_, i) => (
            <div key={i} className={`w-4 h-4 rounded-full transition-all duration-200 ${i < pin.length ? 'bg-blue-500 scale-110' : 'bg-gray-300'} ${error ? 'bg-red-500' : ''}`}></div>
          ))}
        </div>

        <div className="grid grid-cols-3 gap-x-6 gap-y-4 max-w-[260px] mx-auto">
          {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
            <button key={num} onClick={() => handlePinPress(num.toString())} className="w-16 h-16 bg-white rounded-full text-2xl font-bold text-gray-800 shadow-sm border border-gray-100 hover:bg-blue-50 active:bg-blue-100 active:scale-95 transition">
              {num}
            </button>
          ))}
          <div className="w-16 h-16"></div>
          <button onClick={() => handlePinPress('0')} className="w-16 h-16 bg-white rounded-full text-2xl font-bold text-gray-800 shadow-sm border border-gray-100 hover:bg-blue-50 active:bg-blue-100 active:scale-95 transition">
            0
          </button>
          <button onClick={handleBackspace} className="w-16 h-16 bg-white rounded-full flex items-center justify-center text-gray-600 shadow-sm border border-gray-100 hover:bg-red-50 active:bg-red-100 active:scale-95 transition">
            <ChevronLeft size={24} />
          </button>
        </div>
      </div>
    );
  }

  // หน้าจอ Elderly Home ปกติ
  return (
    <div className="px-5 pb-8 space-y-6 animate-fade-in">
      {/* Custom Header for Elderly */}
      <div className="flex justify-between items-center mb-2">
        <div className="flex items-center gap-3">
          <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center text-3xl shadow-sm border border-gray-100">
            👵🏻
          </div>
          <div>
            <p className="text-gray-500 font-bold text-sm">สวัสดีตอนเที่ยง</p>
            <h2 className="text-xl font-extrabold text-gray-800">คุณแม่สมศรี</h2>
          </div>
        </div>
        <button onClick={() => setShowPinPad(true)} className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 hover:bg-gray-50 transition active:scale-95">
          <Settings size={18} className="text-gray-400" />
        </button>
      </div>

      {/* Card 1: Pills */}
      <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
        <div className="flex items-center gap-3 mb-4">
          <div className="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center text-green-500 shrink-0">
            <Clock size={28} />
          </div>
          <div>
            <h3 className="font-bold text-gray-800 text-lg">กินยาครั้งถัดไป</h3>
            <p className="text-green-600 font-extrabold text-3xl">12:30 น.</p>
          </div>
        </div>
        <div className="bg-gray-50 p-4 rounded-2xl mb-5 border border-gray-100">
          <div className="flex justify-between items-center mb-3">
            <span className="text-gray-700 font-bold">มียาทั้งหมด 2 เม็ด</span>
            <button onClick={onMedDetailClick} className="text-blue-500 font-bold text-sm flex items-center hover:underline">
              ดูรายละเอียดยา <ChevronRight size={16} />
            </button>
          </div>
          <div className="flex gap-2">
            <div className="w-11 h-11 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 text-yellow-400"><Pill size={22} /></div>
            <div className="w-11 h-11 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 text-green-400"><Pill size={22} /></div>
          </div>
        </div>
        <button className="w-full bg-[#23A45F] text-white font-bold text-xl py-4 rounded-2xl shadow-sm hover:bg-green-600 transition flex justify-center items-center gap-2">
          <CheckCircle2 size={24} />
          ฉันกินยาแล้ว
        </button>
      </div>

      {/* Card 2: AI Companion */}
      <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 rounded-[2rem] shadow-sm border border-blue-100">
        <div className="flex items-center gap-4 mb-5">
          <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm text-blue-500 shrink-0">
            <Mic size={32} />
          </div>
          <div>
            <h3 className="font-bold text-gray-800 text-xl">เพื่อนคุย AI</h3>
            <p className="text-gray-600 font-medium text-sm mt-0.5 leading-tight">กดเพื่อคุยเมื่อเหงา หรือไม่สบายใจ</p>
          </div>
        </div>
        <button className="w-full bg-[#015DAD] text-white font-bold text-lg py-4 rounded-2xl shadow-sm hover:bg-[#014F95] transition flex justify-center items-center gap-2">
          <PhoneCall size={24} />
          โทรหาน้อง Care
        </button>
      </div>

      {/* Card 3: Emergency */}
      <div className="bg-red-50 p-6 rounded-[2rem] border-2 border-red-100 shadow-sm">
         <div className="text-center mb-5">
            <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 animate-pulse shadow-inner">
               <AlertTriangle size={40} />
            </div>
            <h3 className="font-extrabold text-red-600 text-2xl">ปุ่มฉุกเฉิน</h3>
            <p className="text-red-500 font-bold text-sm mt-1">กดเมื่อต้องการความช่วยเหลือทันที</p>
            <p className="text-xs text-red-400 mt-2 font-medium">*ระบบจะแจ้งเตือนผู้ดูแลทันที</p>
         </div>
         <button className="w-full bg-red-500 text-white font-bold text-xl py-5 rounded-2xl shadow-lg hover:bg-red-600 transition active:scale-95 flex justify-center items-center gap-2">
           <AlertOctagon size={28} />
           ขอความช่วยเหลือ
         </button>
      </div>
    </div>
  );
};

    warnings.push({ title: 'สุขภาพกายลดลง', desc: 'อาจมีอาการอ่อนเพลีย แนะนำให้สังเกตอาการอย่างใกล้ชิดและสอบถามเรื่องการทานยา' });

              </li>
            </ul>
          </div>
        </div>
      )}

      {/* --- Tab Content: Weekly --- */}
      {timeRange === 'weekly' && (

      {timeRange === 'monthly' && (
